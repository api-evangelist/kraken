components:
  parameters:
    asset:
      in: query
      name: asset
      schema:
        type: string
      description: Comma delimited list of assets to get info on (optional, default all available assets)
      example: XBT,ETH
    aclass:
      in: query
      name: aclass
      schema:
        type: string
        enum:
        - currency
        - tokenized_asset
        default: currency
      description: "Filters the asset class to retrieve (optional)\n  * `currency` = spot currency pairs.\n  * `tokenized_asset` = xStocks.\n"
    assetVersion:
      in: query
      name: assetVersion
      required: false
      schema:
        type: integer
        enum:
        - 1
      description: 'Controls whether response keys and asset identifier fields use Kraken''s internal names or display names.


        * Omitted (default): internal names are used. Asset keys use legacy `X`/`Z`-prefixed format (`XXBT`, `ZUSD`). Pair keys use the internal format (`XXBTZUSD`). Asset identifier fields (`base`, `quote`, `fee_volume_currency`) also use internal names.

        * `assetVersion=1`: display names are used. Asset keys become their canonical display names (`BTC`, `USD`). Pair keys become the slash-separated display format (`BTC/USD`). On `/public/AssetPairs`, the `base`, `quote`, and `fee_volume_currency` fields also switch to display names.


        Only `assetVersion=1` is currently supported. The `altname` and `wsname` fields are not affected by this parameter.

        '
    wildcard_pair:
      in: query
      name: pair
      description: 'Asset pair to get data for (optional, default: all tradeable exchange pairs)'
      required: false
      schema:
        type: string
      example: XBTUSD
    asset_class:
      name: asset_class
      in: query
      description: This parameter is required on requests for non-crypto pairs, i.e. use `tokenized_asset` for xStocks.
      required: false
      schema:
        type: string
        enum:
        - tokenized_asset
    pair:
      in: query
      name: pair
      description: Asset pair to get data for
      required: true
      schema:
        type: string
      example: XBTUSD
  schemas:
    trades:
      type: object
      properties:
        result:
          type: object
          additionalProperties:
            x-additionalPropertiesName: pair
            $ref: '#/components/schemas/trade'
          properties:
            last:
              type: string
              description: ID to be used as since when polling for new trade data
        error:
          $ref: '#/components/schemas/error'
    nonce:
      description: Nonce used in construction of `API-Sign` header
      type: integer
      format: int64
    tickData:
      title: TickData
      description: 'Array of tick data arrays

        `[int <time>, string <open>, string <high>, string <low>, string <close>, string <vwap>, string <volume>, int <count>]`

        '
      type: array
      items:
        type: array
        minItems: 8
        maxItems: 8
        items:
          oneOf:
          - type: string
            title: string
          - type: integer
            title: integer
        example:
        - 1548115200
        - '3533.4'
        - '3543.7'
        - '3530.7'
        - '3539.4'
        - '3539.8'
        - '83.09287787'
        - 232
    time:
      description: Success response
      type: object
      properties:
        result:
          title: ServerTime
          type: object
          properties:
            unixtime:
              description: Unix timestamp
              type: integer
            rfc1123:
              description: RFC 1123 time format
              type: string
        error:
          $ref: '#/components/schemas/error'
    spread:
      title: SpreadData
      description: 'Array of spread entries

        `[int <time>, string <bid>, string <ask>]`

        '
      type: array
      items:
        type: array
        items:
          oneOf:
          - type: string
            title: string
          - type: integer
            title: integer
          example:
          - 1548120550
          - '3538.70000'
          - '3541.50000'
    ticker-2:
      type: object
      properties:
        result:
          type: object
          additionalProperties:
            x-additionalPropertiesName: pair
            $ref: '#/components/schemas/ticker'
        error:
          $ref: '#/components/schemas/error'
      example:
        error: []
        result:
          XXBTZUSD:
            a:
            - '30300.10000'
            - '1'
            - '1.000'
            b:
            - '30300.00000'
            - '1'
