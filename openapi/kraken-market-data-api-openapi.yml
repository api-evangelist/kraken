openapi: 3.2.0
info:
  title: Kraken Market Data API
  x-refined-note:
  - x-generated-from differs across the merged source definitions and was not carried
  - x-last-validated differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged Market Data across 3 of this provider''s published API definitions: kraken-openapi.json, kraken-futures-rest-openapi.yml, kraken-spot-rest-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.kraken.com/0
  description: Production Server
- url: https://futures.kraken.com/derivatives/api/v3
  description: Kraken Futures production REST endpoint
- url: https://demo-futures.kraken.com/derivatives/api/v3
  description: Kraken Futures demo / sandbox endpoint
- url: https://colo-london.vip.futures.kraken.com/derivatives/api/v3
  description: Kraken Futures colocation endpoint (London VIP)
- url: https://api.kraken.com
  description: Kraken Spot REST production endpoint
- url: https://colo-london.vip-api.kraken.com
  description: Kraken Spot REST colocation endpoint (London VIP)
tags:
- name: Market Data
paths:
  /public/Time:
    get:
      tags:
      - Market Data
      summary: Get Server Time
      description: Get the server's time.
      operationId: getServerTime
      security: []
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/time'
                example:
                  error: []
                  result:
                    unixtime: 1688669448
                    rfc1123: Thu, 06 Jul 23 18:50:48 +0000
    servers:
    - url: https://api.kraken.com/0
      description: Production Server
  /public/SystemStatus:
    get:
      tags:
      - Market Data
      summary: Get System Status
      description: 'Get the current system status or trading mode, along with any scheduled

        maintenance or ongoing emergency advisories.


        The `upcoming_maintenance` and `emergency` fields are additive — clients that do not read them are unaffected. Both are arrays; empty or absent when no advisory is active.


        * `upcoming_maintenance` carries scheduled events that are within 72 hours. An event is removed once its maintenance window starts.

        * `emergency` carries unresolved status page incidents. An incident is removed when it reaches `resolved`.


        The top-level `status` field remains driven by the trading engine and is

        independent of both arrays: an advisory describes *why* a state is happening

        or coming — it does not dictate engine state.'
      operationId: getSystemStatus
      security: []
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    properties:
                      status:
                        type: string
                        enum:
                        - online
                        - maintenance
                        - cancel_only
                        - post_only
                        description: 'Current system status:

                          * `online`  Kraken is operating normally. All order types may be submitted and trades can occur.

                          * `maintenance`  The exchange is offline. No new orders or cancellations may be submitted.

                          * `cancel_only`  Resting (open) orders can be cancelled but no new orders may be submitted. No trades will occur.

                          * `post_only`  Only post-only limit orders can be submitted. Existing orders may still be cancelled. No trades will occur.

                          '
                      timestamp:
                        type: string
                        description: Current timestamp (RFC3339)
                      upcoming_maintenance:
                        description: 'Scheduled maintenance advisories within the next 72 hours,

                          ordered by `expected_start_utc` ascending. Empty or absent

                          when no scheduled event is active.

                          '
                        type: array
                        items:
                          $ref: '#/components/schemas/scheduledMaintenanceEvent'
                      emergency:
                        description: 'Unresolved incident advisories. Empty or absent when no

                          incident is active.

                          '
                        type: array
                        items:
                          $ref: '#/components/schemas/emergencyEvent'
                  error:
                    $ref: '#/components/schemas/error'
              examples:
                nominal:
                  summary: No advisory active
                  value:
                    error: []
                    result:
                      status: online
                      timestamp: '2023-07-06T18:52:00Z'
                      upcoming_maintenance: []
                      emergency: []
                scheduledMaintenanceApproaching:
                  summary: Scheduled maintenance approaching
                  value:
                    error: []
                    result:
                      status: online
                      timestamp: '2026-05-11T08:30:00Z'
                      upcoming_maintenance:
                      - event_id: 21
                        title: Scheduled Maintenance - Website
                        expected_start_utc: '2026-05-11T09:00:00Z'
                        expected_end_utc: '2026-05-11T10:00:00Z'
                        time_to_start_s: 1740
                        phase: approaching_30m
                        affected_services:
                        - spot_trading
                        order_submission: allowed
                        recommended_action: reduce_activity
                        cancel_before_utc: '2026-05-11T08:55:00Z'
                        source_url: https://status.kraken.com/incidents/b7k2r9wqmn41
                      emergency: []
                emergencyInProgress:
                  summary: Emergency in progress
                  value:
                    error: []
                    result:
                      status: cancel_only
                      timestamp: '2026-05-08T14:28:00Z'
                      upcoming_maintenance: []
                      emergency:
                      - event_id: 4821
                        title: Elevated API error rates
                        incident_status: identified
                        impact: critical
                        affected_services:
                        - spot_ws
                        - spot_rest
                        - spot_fix
                        started_at_utc: '2026-05-08T14:23:11Z'
                        next_steps:
                        - applies_to:
                          - spot_trading
                          type: expected_restart
                          expected_at_utc: '2026-05-08T14:30:00Z'
                        source_url: https://stspg.io/c378t4f7rh0n
    servers:
    - url: https://api.kraken.com/0
      description: Production Server
  /public/MaintenanceSchedule:
    get:
      tags:
      - Market Data
      summary: Get Maintenance Schedule
      description: 'Get all scheduled maintenance events in the next 7-day window, ordered by

        `expected_start_utc` ascending.


        This is the planning view. It differs from the `upcoming_maintenance` array

        on Get System Status,

        which covers only the next 72 hours.


        Each entry carries the same fields as an `upcoming_maintenance` entry,

        including the derived `phase` and the `order_submission` /

        `recommended_action` guidance for that phase.


        Emergency incidents are not scheduled and therefore never appear here — read

        the `emergency` array on Get System Status instead.'
      operationId: getMaintenanceSchedule
      security: []
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    properties:
                      events:
                        description: 'Scheduled maintenance events in the next 7 days, ordered by

                          `expected_start_utc` ascending. Empty when nothing is scheduled.

                          '
                        type: array
                        items:
                          $ref: '#/components/schemas/scheduledMaintenanceEvent'
                  error:
                    $ref: '#/components/schemas/error'
              examples:
                nominal:
                  summary: Two events scheduled
                  value:
                    error: []
                    result:
                      events:
                      - event_id: 21
                        title: Scheduled Maintenance - Website
                        expected_start_utc: '2026-05-11T09:00:00Z'
                        expected_end_utc: '2026-05-11T10:00:00Z'
                        time_to_start_s: 1740
                        phase: approaching_30m
                        affected_services:
                        - spot_trading
                        order_submission: allowed
                        recommended_action: reduce_activity
                        cancel_before_utc: '2026-05-11T08:55:00Z'
                        source_url: https://status.kraken.com/incidents/b7k2r9wqmn41
                      - event_id: 34
                        title: REST API infrastructure upgrade
                        expected_start_utc: '2026-05-14T02:00:00Z'
                        expected_end_utc: '2026-05-14T02:30:00Z'
                        time_to_start_s: 236940
                        phase: announced
                        affected_services:
                        - spot_rest
                        - spot_ws
                        order_submission: allowed
                        recommended_action: continue
                        cancel_before_utc: '2026-05-14T01:55:00Z'
                        source_url: https://status.kraken.com/incidents/d3f8h1xpqv62
                empty:
                  summary: Nothing scheduled
                  value:
                    error: []
                    result:
                      events: []
    servers:
    - url: https://api.kraken.com/0
      description: Production Server
  /public/Assets:
    get:
      tags:
      - Market Data
      summary: Get Asset Info
      description: Get information about the assets that are available for deposit, withdrawal, trading and earn.
      operationId: getAssetInfo
      security: []
      parameters:
      - $ref: '#/components/parameters/asset'
      - $ref: '#/components/parameters/aclass'
      - $ref: '#/components/parameters/assetVersion'
      responses:
        '200':
          description: Asset info retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/info-2'
                example:
                  error: []
                  result:
                    XXBT:
                      aclass: currency
                      altname: XBT
                      decimals: 10
                      display_decimals: 5
                      collateral_value: 1
                      status: enabled
                    ZEUR:
                      aclass: currency
                      altname: EUR
                      decimals: 4
                      display_decimals: 2
                      collateral_value: 1
                      status: enabled
                    ZUSD:
                      aclass: currency
                      altname: USD
                      decimals: 4
                      display_decimals: 2
                      collateral_value: 1
                      status: enabled
    servers:
    - url: https://api.kraken.com/0
      description: Production Server
  /public/AssetPairs:
    get:
      tags:
      - Market Data
      summary: Get Tradable Asset Pairs
      description: Get tradable asset pairs
      operationId: getTradableAssetPairs
      security: []
      parameters:
      - $ref: '#/components/parameters/assetVersion'
      - in: query
        name: pair
        description: Asset pairs to get data for
        schema:
          type: string
        example: BTC/USD,ETH/BTC
      - in: query
        name: aclass_base
        schema:
          type: string
          enum:
          - currency
          - tokenized_asset
          default: currency
        description: "Filters the asset class to retrieve (optional)\n\n  * `currency` = spot currency pairs.\n  * `tokenized_asset` = tokenized asset pairs, i.e. xStocks.\n"
      - in: query
        name: info
        schema:
          type: string
          enum:
          - info
          - leverage
          - fees
          - margin
          default: info
        description: "Info to retrieve (optional)\n\n  * `info` = all info\n  * `leverage` = leverage info\n  * `fees` = fees schedule\n  * `margin` = margin info\n"
      - in: query
        name: country_code
        description: Filter for response to only include pairs available in the provided country/region (ISO 3166-1 alpha-2 code).
        schema:
          type: string
        example: GB
      - in: query
        name: execution_venue
        schema:
          type: string
          enum:
          - international
          - bitnomial_exchange
          default: international
        description: "Comma-separated list of execution venues to filter by (optional)\n\n  * `international` = International exchange\n  * `bitnomial_exchange` = Bitnomial exchange\n"
      responses:
        '200':
          description: Tradable asset pairs retrieved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    description: Pair names and their info
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/pairs'
                  error:
                    $ref: '#/components/schemas/error'
                example:
                  error: []
                  result:
                    XETHXXBT:
                      altname: ETHXBT
                      wsname: ETH/XBT
                      aclass_base: currency
                      base: XETH
                      aclass_quote: currency
                      quote: XXBT
                      lot: unit
                      cost_decimals: 6
                      pair_decimals: 5
                      lot_decimals: 8
                      lot_multiplier: 1
                      leverage_buy:
                      - 2
                      - 3
                      - 4
                      - 5
                      leverage_sell:
                      - 2
                      - 3
                      - 4
                      - 5
                      fees: []
                      fees_maker: []
                      fee_volume_currency: ZUSD
                      margin_call: 80
                      margin_stop: 40
                      ordermin: '0.01'
                      costmin: '0.00002'
                      tick_size: '0.00001'
                      status: online
                      long_position_limit: 1100
                      short_position_limit: 400
                    XXBTZUSD:
                      altname: XBTUSD
                      wsname: XBT/USD
                      aclass_base: currency
                      base: XXBT
                      aclass_quote: currency
                      quote: ZUSD
                      lot: unit
                      cost_decimals: 5
                      pair_decimals: 1
                      lot_decimals: 8
                      lot_multiplier: 1
                      leverage_buy:
                      - 2
                      - 3
                      - 4
                      - 5
                      leverage_sell:
                      - 2
                      - 3
                      - 4
                      - 5
                      fees: []
                      fees_maker: []
                      fee_volume_currency: ZUSD
                      margin_call: 80
                      margin_stop: 40
                      ordermin: '0.0001'
                      costmin: '0.5'
                      tick_size: '0.1'
                      status: online
                      long_position_limit: 250
                      short_position_limit: 200
    servers:
    - url: https://api.kraken.com/0
      description: Production Server
  /public/Ticker:
    get:
      summary: Get Ticker Information
      description: 'Get ticker information for all or requested markets. To clarify usage, note that

        * Today''s prices start at midnight UTC

        * Leaving the pair parameter blank will return tickers for all tradeable assets on Kraken'
      tags:
      - Market Data
      operationId: getTickerInformation
      security: []
      parameters:
      - $ref: '#/components/parameters/wildcard_pair'
      - $ref: '#/components/parameters/assetVersion'
      - name: asset_class
        in: query
        description: This parameter is required on requests for tokenized pairs, i.e. xStocks. If `asset_class` is provided without the `pair` parameter, all pairs for that asset class will be returned.
        required: false
        schema:
          type: string
          enum:
          - tokenized_asset
          - forex
          default: forex
      responses:
        '200':
          description: Ticker info retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ticker-2'
    servers:
    - url: https://api.kraken.com/0
      description: Production Server
  /public/OHLC:
    get:
      summary: Get OHLC Data
      description: 'Retrieve OHLC market data.

        The last entry in the OHLC array is for the current, not-yet-committed timeframe, and will always be present, regardless of the value of `since`.

        Returns up to 720 of the most recent entries (older data cannot be retrieved, regardless of the value of `since`).'
      tags:
      - Market Data
      operationId: getOHLCData
      security: []
      parameters:
      - $ref: '#/components/parameters/pair'
      - $ref: '#/components/parameters/assetVersion'
      - name: interval
        description: Time frame interval in minutes
        in: query
        schema:
          type: integer
          default: 1
          enum:
          - 1
          - 5
          - 15
          - 30
          - 60
          - 240
          - 1440
          - 10080
          - 21600
        example: 60
      - name: since
        in: query
        description: Return OHLC entries since the given timestamp (intended for incremental updates)
        schema:
          type: integer
        example: 1688671200
      - $ref: '#/components/parameters/asset_class'
      responses:
        '200':
          description: OHLC data retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ohlc'
                example:
                  error: []
                  result:
                    XXBTZUSD:
                    - - 1688671200
                      - '30306.1'
