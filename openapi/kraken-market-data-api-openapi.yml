  /public/Depth:
    get:
      summary: Get Order Book
      description: Returns level 2 (L2) order book, which describes the individual price levels in the book with aggregated order quantities at each level.
      tags:
      - Market Data
      operationId: getOrderBook
      security: []
      parameters:
      - $ref: '#/components/parameters/pair'
      - $ref: '#/components/parameters/assetVersion'
      - name: count
        description: Maximum number of asks/bids
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
        example: 2
      - $ref: '#/components/parameters/asset_class'
      responses:
        '200':
          description: Order book entries retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/depth'
                example:
                  error: []
                  result:
                    XXBTZUSD:
                      asks:
                      - - '30384.10000'
                        - '2.059'
                        - 1688671659
                      - - '30387.90000'
                        - '1.500'
                        - 1688671380
                      - - '30393.70000'
                        - '9.871'
                        - 1688671261
                      bids:
                      - - '30297.00000'
                        - '1.115'
                        - 1688671636
                      - - '30296.70000'
                        - '2.002'
                        - 1688671674
                      - - '30289.80000'
                        - '5.001'
                        - 1688671673
    servers:
    - url: https://api.kraken.com/0
      description: Production Server
  /private/Level3:
    post:
      summary: Query L3 Order Book
      description: 'Retrieve Level3 order book data, which provides individual order information at each price level.

        This includes order IDs and timestamps for each order in the book.


        The Level3 endpoint requires authentication.


        **API Key Permissions Required:** `Orders and trades - Query open orders & trades`'
      tags:
      - Market Data
      operationId: getLevel3OrderBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nonce:
                  $ref: '#/components/schemas/nonce'
                pair:
                  type: string
                  description: Asset pair to get order book for
                  example: YFI/EUR
                depth:
                  type: integer
                  description: Number of price levels to return per side (bids/asks). Use 0 to return the full book.
                  enum:
                  - 0
                  - 10
                  - 25
                  - 100
                  - 250
                  - 1000
                  default: 100
                  example: 10
              required:
              - nonce
              - pair
      responses:
        '200':
          description: Level 3 order book data retrieved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    properties:
                      pair:
                        type: string
                        description: Asset pair
                      bids:
                        type: array
                        description: Bid orders
                        items:
                          type: object
                          properties:
                            price:
                              type: string
                              description: Bid price
                            qty:
                              type: string
                              description: Bid quantity
                            order_id:
                              type: string
                              description: Order ID
                            timestamp:
                              type: integer
                              description: Order timestamp (nanoseconds)
                      asks:
                        type: array
                        description: Ask orders
                        items:
                          type: object
                          properties:
                            price:
                              type: string
                              description: Ask price
                            qty:
                              type: string
                              description: Ask quantity
                            order_id:
                              type: string
                              description: Order ID
                            timestamp:
                              type: integer
                              description: Order timestamp (nanoseconds)
                  error:
                    type: array
                    items:
                      $ref: '#/components/schemas/error'
              example:
                error: []
                result:
                  pair: YFI/EUR
                  bids:
                  - price: '3062.00000'
                    qty: '0.29665800'
                    order_id: O5KJU4-IEQTM-NDMS6W
                    timestamp: 1765622008594292000
                  - price: '3062.00000'
                    qty: '0.13917400'
                    order_id: OERRY6-MXYER-6EQKNY
                    timestamp: 1765622011396903000
                  asks:
                  - price: '3066.00000'
                    qty: '0.00278335'
                    order_id: ORAWGV-N5L4J-LBA3WH
                    timestamp: 1765622008499456000
                  - price: '3067.00000'
                    qty: '0.13902210'
                    order_id: OZWNZS-QE3G6-ZPKZUT
                    timestamp: 1765622021013826600
      security:
      - API-Key: []
        API-Sign: []
    servers:
    - url: https://api.kraken.com/0
      description: Production Server
  /public/GroupedBook:
    get:
      summary: Get Grouped Order Book
      description: 'The GroupedBook endpoint aggregates the volume in the order book over a specified tick range.

        It provides a summary of liquidity deep into the book, useful for user interface display.


        Bids and asks between grouped price levels are accumulated to the nearest passive level (asks rounded up, bids down).'
      tags:
      - Market Data
      operationId: getGroupedOrderBook
      security: []
      parameters:
      - in: query
        name: pair
        required: true
        schema:
          type: string
        description: Asset pair to get order book for
        example: BTC/USD
      - in: query
        name: depth
        schema:
          type: integer
          enum:
          - 10
          - 25
          - 100
          - 250
          - 1000
          default: 10
        description: The number of price levels to return per side (bids/asks).
        example: 10
      - in: query
        name: grouping
        schema:
          type:
          - integer
          - 'null'
          format: int32
          enum:
          - 1
          - 5
          - 10
          - 25
          - 50
          - 100
          - 250
          - 500
          - 1000
          default: 1
        description: Specifies how many tick levels should be within each price level. Bids and asks between grouped price levels are accumulated to the nearest passive level (asks rounded up, bids down).
        example: 1000
      responses:
        '200':
          description: Grouped order book data retrieved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    properties:
                      pair:
                        type: string
                        description: Asset pair
                      grouping:
                        type: integer
                        description: The grouping value used
                      bids:
                        type: array
                        description: Aggregated bid levels
                        items:
                          type: object
                          properties:
                            price:
                              type: string
                              description: Grouped price level
                            qty:
                              type: string
                              description: Aggregated quantity at this price level
                      asks:
                        type: array
                        description: Aggregated ask levels
                        items:
                          type: object
                          properties:
                            price:
                              type: string
                              description: Grouped price level
                            qty:
                              type: string
                              description: Aggregated quantity at this price level
                  error:
                    type: array
                    items:
                      $ref: '#/components/schemas/error'
              example:
                error: []
                result:
                  pair: BTC/USD
                  grouping: 1000
                  bids:
                  - price: '90400.00000'
