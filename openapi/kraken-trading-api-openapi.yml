openapi: 3.2.0
info:
  title: Kraken Trading API
  x-refined-note:
  - x-generated-from differs across the merged source definitions and was not carried
  - x-last-validated differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged Trading across 3 of this provider''s published API definitions: kraken-openapi.json, kraken-futures-rest-openapi.yml, kraken-spot-rest-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.kraken.com/0
  description: Production Server
- url: https://futures.kraken.com/derivatives/api/v3
  description: Kraken Futures production REST endpoint
- url: https://demo-futures.kraken.com/derivatives/api/v3
  description: Kraken Futures demo / sandbox endpoint
- url: https://colo-london.vip.futures.kraken.com/derivatives/api/v3
  description: Kraken Futures colocation endpoint (London VIP)
- url: https://api.kraken.com
  description: Kraken Spot REST production endpoint
- url: https://colo-london.vip-api.kraken.com
  description: Kraken Spot REST colocation endpoint (London VIP)
tags:
- name: Trading
paths:
  /private/AddOrder:
    post:
      summary: Add Order
      description: 'Place a new order.


        **Note**: See the AssetPairs endpoint for details on the available trading pairs, their price and quantity precisions, order minimums, available leverage, etc.


        **API Key Permissions Required:** `Orders and trades - Create & modify orders`'
      tags:
      - Trading
      operationId: addOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/add'
      responses:
        '200':
          description: Order added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/add-2'
              examples:
                Limit with conditional stop-loss:
                  value:
                    error: []
                    result:
                      descr:
                        order: buy 2.12340000 XBTUSD @ limit 25000.1 with 2:1 leverage
                        close: close position @ stop loss 22000.0 -> limit 21000.0
                      txid:
                      - OUF4EM-FRGI2-MQMWZD
      security:
      - API-Key: []
        API-Sign: []
    servers:
    - url: https://api.kraken.com/0
      description: Production Server
  /private/AmendOrder:
    post:
      summary: Amend Order
      description: 'The amend request enables clients to modify the order parameters in-place without the need to cancel the existing order and create a new one.


        * The order identifiers assigned by Kraken and/or client will stay the same.

        * Queue priority in the order book will be maintained where possible.

        * If an amend request will reduce the order quantity below the existing filled quantity, the remaining quantity will be cancelled.


        For more detail, see amend transaction guide.


        **API Key Permissions Required:** `Orders and trades - Create & modify orders` or `Orders and trades - Cancel & close orders`'
      tags:
      - Trading
      operationId: amendOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/amend'
      responses:
        '200':
          description: 'A successful amend request will return the unique Kraken amend identifier.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/amend-2'
      security:
      - API-Key: []
        API-Sign: []
    servers:
    - url: https://api.kraken.com/0
      description: Production Server
  /private/CancelOrder:
    post:
      summary: Cancel Order
      description: 'Cancel a particular open order (or set of open orders) by `txid`, `userref` or `cl_ord_id`


        **API Key Permissions Required:** `Orders and trades - Create & modify orders` or `Orders and trades - Cancel & close orders`'
      tags:
      - Trading
      operationId: cancelOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/cancel'
      responses:
        '200':
          description: Open order cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cancel-2'
      security:
      - API-Key: []
        API-Sign: []
    servers:
    - url: https://api.kraken.com/0
      description: Production Server
  /private/CancelAll:
    post:
      summary: Cancel All Orders
      description: 'Cancel all open orders


        **API Key Permissions Required:** `Orders and trades - Create & modify orders` or `Orders and trades - Cancel & close orders`'
      tags:
      - Trading
      operationId: cancelAllOrders
      requestBody:
        $ref: '#/components/requestBodies/nonceOnly'
      responses:
        '200':
          description: Open orders cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cancel-2'
      security:
      - API-Key: []
        API-Sign: []
    servers:
    - url: https://api.kraken.com/0
      description: Production Server
  /private/CancelAllOrdersAfter:
    post:
      summary: Cancel All Orders After X
      tags:
      - Trading
      operationId: cancelAllOrdersAfter
      description: 'CancelAllOrdersAfter provides a "Dead Man''s Switch" mechanism to protect the client from network malfunction, extreme latency or unexpected matching engine downtime. The client can send a request with a timeout (in seconds), that will start a countdown timer which will cancel *all* client orders when the timer expires. The client has to keep sending new requests to push back the trigger time, or deactivate the mechanism by specifying a timeout of 0. If the timer expires, all orders are cancelled and then the timer remains disabled until the client provides a new (non-zero) timeout.


        The recommended use is to make a call every 15 to 30 seconds, providing a timeout of 60 seconds. This allows the client to keep the orders in place in case of a brief disconnection or transient delay, while keeping them safe in case of a network breakdown. It is also recommended to disable the timer ahead of regularly scheduled trading engine maintenance (if the timer is enabled, all orders will be cancelled when the trading engine comes back from downtime - planned or otherwise).


        **API Key Permissions Required:** `Orders and trades - Create & modify orders` or `Orders and trades - Cancel & close orders`'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
              - nonce
              - timeout
              properties:
                nonce:
                  $ref: '#/components/schemas/nonce'
                timeout:
                  type: integer
                  description: Duration (in seconds) to set/extend the timer, it should be less than 86400 seconds.
              example:
                nonce: 1695828490
                timeout: 120
      responses:
        '200':
          description: Dead man's switch timer reset or disabled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    properties:
                      currentTime:
                        description: Timestamp (RFC3339 format) at which the request was received
                        type: string
                      triggerTime:
                        description: Timestamp (RFC3339 format) after which all orders will be cancelled, unless the timer is extended or disabled
                        type: string
                  error:
                    $ref: '#/components/schemas/error'
                example:
                  error: []
                  result:
                    currentTime: '2023-03-24T17:41:56Z'
                    triggerTime: '2023-03-24T17:42:56Z'
      security:
      - API-Key: []
        API-Sign: []
    servers:
    - url: https://api.kraken.com/0
      description: Production Server
  /private/GetWebSocketsToken:
    post:
      summary: Get Websockets Token
      description: 'An authentication token must be requested via this REST API endpoint in order to connect to and authenticate with our Websockets API. The token should be used within 15 minutes of creation, but it does not expire once a successful Websockets connection and private subscription has been made and is maintained.


        **API Key Permissions Required:** `WebSocket interface - On`'
      tags:
      - Trading
      operationId: getWebsocketsToken
      requestBody:
        $ref: '#/components/requestBodies/nonceOnly'
      responses:
        '200':
          description: Websockets token retrieved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    properties:
                      token:
                        description: Websockets token
                        type: string
                      expires:
                        description: Time (in seconds) after which the token expires
                        type: integer
                  error:
                    $ref: '#/components/schemas/error'
                example:
                  error: []
                  result:
                    token: 1Dwc4lzSwNWOAwkMdqhssNNFhs1ed606d1WcF3XfEMw
                    expires: 900
      security:
      - API-Key: []
        API-Sign: []
    servers:
    - url: https://api.kraken.com/0
      description: Production Server
  /private/AddOrderBatch:
    post:
      summary: Add Order Batch
      description: 'Sends a collection of orders (minimum of 2 and maximum 15):

        * Validation is performed on the whole batch prior to submission to the engine. If an order fails validation, the whole batch will be rejected.

        * On submission to the engine, if an order fails pre-match checks (i.e. funding), then the individual order will be rejected and remainder of the batch will be processed.

        * All orders in batch are limited to a single pair.


        **Note**: See the AssetPairs endpoint for details on the available trading pairs, their price and quantity precisions, order minimums, available leverage, etc.


        **API Key Permissions Required:** `Orders and trades - Create & modify orders` and `Orders and trades - Cancel & close orders`'
      tags:
      - Trading
      operationId: addOrderBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/batchadd'
      responses:
        '200':
          description: The order of returned `orders` in the response array is the same as the order of the order list sent in request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/batchadd-2'
              examples:
                Limits, one with conditional stop-loss:
                  value:
                    error: []
                    result:
                      orders:
                      - txid: O5OR23-ADFAD-Y2G61C
                        descr:
                          order: buy 0.80300000 XBTUSD @ limit 28300.0
                          close: close position @ stop loss 27000.0 -> limit 26000.0
                      - txid: 9K6KFS-5H3PL-XBRC7A
                        descr:
                          order: sell 0.10500000 XBTUSD @ limit 36000.0
      security:
      - API-Key: []
        API-Sign: []
    servers:
    - url: https://api.kraken.com/0
      description: Production Server
  /private/CancelOrderBatch:
    post:
      summary: Cancel Order Batch
      description: 'Cancel multiple open orders by `txid`, `userref` or `cl_ord_id`(maximum 50 total unique IDs/references)


        **API Key Permissions Required:** `Orders and trades - Create & modify orders` or `Orders and trades - Cancel & close orders`'
      tags:
      - Trading
      operationId: cancelOrderBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/batchcancel'
      responses:
        '200':
          description: Open order cancelled.
          content:
            application/json:
              example:
                error: []
                result:
                  count: 2
      security:
      - API-Key: []
        API-Sign: []
    servers:
    - url: https://api.kraken.com/0
      description: Production Server
  /private/EditOrder:
    post:
      summary: Edit Order
      description: 'Sends a request to edit the order parameters of a live order. When an order has been successfully modified, the original order will be cancelled and a new order will be

        created with the adjusted parameters a new `txid` will be returned in the response.


        **Note:** The new AmendOrder endpoint resolves the caveats listed below and has additional performance gains.


        Caveats for `EditOrder`:

        * Triggered stop loss or take profit orders are not supported.

        * Orders with conditional close terms attached are not supported.

        * Orders where the executed volume is greater than the newly supplied volume will be rejected.

        * `cl_ord_id` is not supported.

        * Existing executions are associated with the original order and not copied to the amended order.

        * Queue position will not be maintained.


        **API Key Permissions Required:** `Orders and trades - Create & modify orders` and `Orders and trades - Cancel & close orders`'
      tags:
      - Trading
      operationId: editOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/edit'
      responses:
        '200':
          description: Order edited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/edit-2'
              examples:
                Limit with conditional stop-loss:
                  value:
                    error: []
                    result:
                      status: ok
                      txid: OFVXHJ-KPQ3B-VS7ELA
                      originaltxid: OHYO67-6LP66-HMQ437
                      volume: '0.00030000'
                      price: '19500.0'
                      price2: '32500.0'
                      orders_cancelled: 1
                      descr:
                        order: buy 0.00030000 XXBTZGBP @ limit 19500.0
      security:
      - API-Key: []
        API-Sign: []
    servers:
    - url: https://api.kraken.com/0
      description: Production Server
  /sendorder:
    post:
      operationId: sendOrder
      summary: Kraken Send Order
      description: Places a new futures order (lmt, mkt, stp, take_profit, ioc).
      tags:
      - Trading
      security:
      - futures_signature: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SendOrderRequest'
            examples:
              sendOrderRequestExample:
                summary: Default sendOrder request
                x-microcks-default: true
                value:
                  orderType: lmt
                  symbol: PI_XBTUSD
                  side: buy
                  size: 0.01
                  limitPrice: '0.01'
                  stopPrice: '0.01'
                  triggerSignal: mark
                  reduceOnly: true
                  cliOrdId: OQCLML-BW3P3-BUCMWZ
                  trailingStopMaxDeviation: 0.01
                  trailingStopDeviationUnit: string
      responses:
        '200':
          description: Order acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseEnvelope'
              examples:
                sendOrder200Example:
                  summary: Default sendOrder 200 response
                  x-microcks-default: true
                  value:
                    result: success
                    serverTime: '2026-05-30T00:00:00Z'
                    error: string
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    servers:
    - url: https://futures.kraken.com/derivatives/api/v3
      description: Kraken Futures production REST endpoint
    - url: https://demo-futures.kraken.com/derivatives/api/v3
      description: Kraken Futures demo / sandbox endpoint
    - url: https://colo-london.vip.futures.kraken.com/derivatives/api/v3
      description: Kraken Futures colocation endpoint (London VIP)
  /editorder:
    post:
      operationId: editOrderFutures
      summary: Kraken Edit Order (Futures)
      description: Modifies a resting futures order (size, limitPrice, stopPrice).
      tags:
      - Trading
      security:
      - futures_signature: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EditOrderFuturesRequest'
            examples:
              editOrderFuturesRequestExample:
                summary: Default editOrderFutures request
                x-microcks-default: true
                value:
                  orderId: OQCLML-BW3P3-BUCMWZ
                  cliOrdId: OQCLML-BW3P3-BUCMWZ
                  size: 0.01
                  limitPrice: '0.01'
                  stopPrice: '0.01'
                  trailingStopMaxDeviation: 0.01
                  trailingStopDeviationUnit: string
      responses:
        '200':
          description: Edit acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseEnvelope'
              examples:
                editOrderFutures200Example:
                  summary: Default editOrderFutures 200 response
                  x-microcks-default: true
                  value:
                    result: success
                    serverTime: '2026-05-30T00:00:00Z'
                    error: string
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    servers:
    - url: https://futures.kraken.com/derivatives/api/v3
      description: Kraken Futures production REST endpoint
    - url: https://demo-futures.kraken.com/derivatives/api/v3
      description: Kraken Futures demo / sandbox endpoint
    - url: https://colo-london.vip.futures.kraken.com/derivatives/api/v3
      description: Kraken Futures colocation endpoint (London VIP)
  /cancelorder:
    post:
      operationId: cancelOrderFutures
      summary: Kraken Cancel Order (Futures)
      description: Cancels a specific open futures order.
      tags:
      - Trading
      security:
      - futures_signature: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - order_id
              properties:
                order_id:
                  type: string
                cliOrdId:
                  type: string
            examples:
              cancelOrderFuturesRequestExample:
                summary: Default cancelOrderFutures request
                x-microcks-default: true
                value:
                  order_id: string
                  cliOrdId: string
      responses:
        '200':
          description: Cancel acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseEnvelope'
              examples:
                cancelOrderFutures200Example:
                  summary: Default cancelOrderFutures 200 response
                  x-microcks-default: true
                  value:
                    result: success
                    serverTime: '2026-05-30T00:00:00Z'
                    error: string
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    servers:
    - url: https://futures.kraken.com/derivatives/api/v3
      description: Kraken Futures production REST endpoint
    - url: https://demo-futures.kraken.com/derivatives/api/v3
      description: Kraken Futures demo / sandbox endpoint
    - url: https://colo-london.vip.futures.kraken.com/derivatives/api/v3
      description: Kraken Futures colocation endpoint (London VIP)
  /cancelallorders:
    post:
      operationId: cancelAllOrdersFutures
      summary: Kraken Cancel All Orders (Futures)
      description: Cancels every open futures order, optionally scoped to a single instrument.
      tags:
      - Trading
      security:
      - futures_signature: []
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                symbol:
                  type: string
            examples:
              cancelAllOrdersFuturesRequestExample:
                summary: Default cancelAllOrdersFutures request
                x-microcks-default: true
                value:
                  symbol: string
      responses:
        '200':
          description: Cancel-all acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseEnvelope'
              examples:
                cancelAllOrdersFutures200Example:
                  summary: Default cancelAllOrdersFutures 200 response
                  x-microcks-default: true
                  value:
                    result: success
                    serverTime: '2026-05-30T00:00:00Z'
                    error: string
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    servers:
    - url: https://futures.kraken.com/derivatives/api/v3
      description: Kraken Futures production REST endpoint
    - url: https://demo-futures.kraken.com/derivatives/api/v3
      description: Kraken Futures demo / sandbox endpoint
    - url: https://colo-london.vip.futures.kraken.com/derivatives/api/v3
      description: Kraken Futures colocation endpoint (London VIP)
  /cancelallordersafter:
    post:
      operationId: cancelAllOrdersAfterFutures
      summary: Kraken Cancel All Orders After (Futures)
      description: Dead-man's-switch for futures — cancels all orders after the timeout unless re-armed.
      tags:
      - Trading
      security:
      - futures_signature: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - timeout
              properties:
                timeout:
                  type: integer
            examples:
              cancelAllOrdersAfterFuturesRequestExample:
                summary: Default cancelAllOrdersAfterFutures request
                x-microcks-default: true
                value:
                  timeout: 1
      responses:
        '200':
          description: Dead-man's-switch status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseEnvelope'
              examples:
                cancelAllOrdersAfterFutures200Example:
                  summary: Default cancelAllOrdersAfterFutures 200 response
                  x-microcks-default: true
                  value:
                    result: success
                    serverTime: '2026-05-30T00:00:00Z'
                    error: string
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    servers:
    - url: https://futures.kraken.com/derivatives/api/v3
      description: Kraken Futures production REST endpoint
    - url: https://demo-futures.kraken.com/derivatives/api/v3
      description: Kraken Futures demo / sandbox endpoint
    - url: https://colo-london.vip.futures.kraken.com/derivatives/api/v3
      description: Kraken Futures colocation endpoint (London VIP)
  /batchorder:
    post:
      operationId: batchOrderFutures
      summary: Kraken Batch Order (Futures)
      description: Submits a batch of order operations (place/edit/cancel) in a single signed call.
      tags:
      - Trading
      security:
      - futures_signature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                batchOrder:
                  type: array
                  items:
                    type: object
            examples:
              batchOrderFuturesRequestExample:
                summary: Default batchOrderFutures request
                x-microcks-default: true
                value:
                  batchOrder:
                  - {}
      responses:
        '200':
          description: Batch acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseEnvelope'
              examples:
                batchOrderFutures200Example:
                  summary: Default batchOrderFutures 200 response
                  x-microcks-default: true
                  value:
                    result: success
                    serverTime: '2026-05-30T00:00:00Z'
                    error: string
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    servers:
    - url: https://futures.kraken.com/derivatives/api/v3
      description: Kraken Futures production REST endpoint
    - url: https://demo-futures.kraken.com/derivatives/api/v3
      description: Kraken Futures demo / sandbox endpoint
    - url: https://colo-london.vip.futures.kraken.com/derivatives/api/v3
      description: Kraken Futures colocation endpoint (London VIP)
  /0/private/AddOrder:
    post:
      operationId: post0PrivateAddOrder
      summary: Kraken Add Order
      description: Places a new order. Supports market, limit, stop-loss, take-profit, stop-loss-limit, take-profit-limit, settle-position, trailing-stop, and iceberg order types.
      tags:
      - Trading
      security:
      - kraken_signature: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddOrderRequest'
            examples:
              addOrderRequestExample:
                summary: Default addOrder request
                x-microcks-default: true
                value:
                  nonce: 1717000000000
                  otp: '123456'
                  userref: 1
                  cl_ord_id: OQCLML-BW3P3-BUCMWZ
                  ordertype: market
                  type: buy
                  volume: '0.01'
                  displayvol: '0.01'
                  pair: XBTUSD
                  price: '0.01'
                  price2: '0.01'
                  trigger: last
                  leverage: none
                  reduce_only: true
                  stptype: cancel-newest
                  oflags: string
                  timeinforce: GTC
                  starttm: string
                  expiretm: string
                  close[ordertype]: string
                  close[price]: '0.01'
                  close[price2]: '0.01'
                  deadline: string
                  validate: true
      responses:
        '200':
          description: Order accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddOrderResponse'
              examples:
                addOrder200Example:
                  summary: Default addOrder 200 response
                  x-microcks-default: true
                  value:
                    error: []
                    result: {}
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      x-operation-id-source: normalized
      x-operation-id-original: addOrder
    servers:
    - url: https://api.kraken.com
      description: Kraken Spot REST production endpoint
    - url: https://colo-london.vip-api.kraken.com
      description: Kraken Spot REST colocation endpoint (London VIP)
  /0/private/AddOrderBatch:
    post:
      operationId: post0PrivateAddOrderBatch
      summary: Kraken Add Order Batch
      description: Places a batch of up to 15 orders for a single pair in one signed request.
      tags:
      - Trading
      security:
      - kraken_signature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddOrderBatchRequest'
            examples:
              addOrderBatchRequestExample:
                summary: Default addOrderBatch request
                x-microcks-default: true
                value:
                  nonce: 1717000000000
                  otp: '123456'
                  pair: XBTUSD
                  deadline: string
                  validate: true
                  orders: []
      responses:
        '200':
          description: Batch order acceptance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddOrderBatchResponse'
              examples:
                addOrderBatch200Example:
                  summary: Default addOrderBatch 200 response
                  x-microcks-default: true
