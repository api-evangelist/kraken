    edit:
      title: Edit Standard Order Request Body
      required:
      - nonce
      - pair
      - txid
      type: object
      properties:
        nonce:
          $ref: '#/components/schemas/nonce'
        userref:
          description: "User reference id\n\n`userref` is an optional user-specified integer id associated with edit request. \n >  Note: userref from parent order will not be retained on the new order after edit.\n"
          type: integer
          format: int32
        txid:
          description: Original Order ID or User Reference Id (userref) which is user-specified integer id used with the original order. If userref is not unique and was used with multiple order, edit request is denied with an error.
          oneOf:
          - type: string
            title: string
          - type: integer
            title: integer
        volume:
          description: 'Order quantity in terms of the base asset.

            '
          type: string
        displayvol:
          description: 'For `iceberg` orders only, it defines the quantity to show in the book while the rest of order quantity remains hidden. Minimum value is 1 / 15 of `volume`.

            '
          type: string
        pair:
          description: Asset pair `id` or `altname`
          type: string
        asset_class:
          description: This parameter is required on requests for non-crypto pairs, i.e. use `tokenized_asset` for xStocks.
          type: string
          enum:
          - tokenized_asset
        price:
          description: 'Price:

            * Limit price for `limit` and `iceberg` orders

            * Trigger price for `stop-loss`, `stop-loss-limit`, `take-profit`, `take-profit-limit`, `trailing-stop` and `trailing-stop-limit` orders


            Notes:

            * Relative Prices: Either `price` or `price2` can be preceded by `+`, `-`, or `#` to specify the order price as an offset relative to the last traded price. `+` adds the amount to, and `-` subtracts the amount from the last traded price. `#` will either add or subtract the amount to the last traded price, depending on the direction and order type used. Prices can also be suffixed with a `%` to signify the relative amount as a percentage, rather than an absolute price difference.

            * Trailing Stops: Must use a relative price for this field, namely the `+` prefix, from which the direction will be automatic based on if the original order is a buy or sell (no need to use `-` or `#`). The `%` suffix also works for these order types to use a relative percentage price.

            '
          type: string
        price2:
          description: 'Secondary Price:

            * Limit price for `stop-loss-limit`, `take-profit-limit` and `trailing-stop-limit` orders

            Note:

            * Trailing Stops: Must use a relative price for this field, namely one of the `+` or `-` prefixes. This will provide the offset from the trigger price to the limit price, i.e. +0 would set the limit price equal to the trigger price. The `%` suffix also works for this field to use a relative percentage limit price.

            '
          type: string
        oflags:
          description: 'Comma delimited list of order flags. Only these flags can be changed: - post post-only order (available when ordertype = limit). All the flags from the parent order are retained except post-only. post-only needs to be explicitly mentioned on edit request.

            '
        deadline:
          type: string
          description: "RFC3339 timestamp (e.g. 2021-04-01T00:18:45Z) after which the matching engine should reject the new order request, in presence of latency or order queueing. min now() + 2 seconds, max now() + 60 seconds.  \n"
        cancel_response:
          description: 'Used to interpret if client wants to receive pending replace, before the order is completely replaced

            '
          type: boolean
        validate:
          type: boolean
          description: Validate inputs only. Do not submit order.
          default: false
      example:
        nonce: 1695828490
        pair: XBTUSD
        txid: OHYO67-6LP66-HMQ437
        volume: '1.25'
        price: '27500'
        price2: '26500'
    add:
      example:
        nonce: 163245617
        ordertype: limit
        type: buy
        volume: '1.25'
        pair: XBTUSD
        price: '27500'
        cl_ord_id: 6d1b345e-2821-40e2-ad83-4ecb18a06876
      title: Add Standard Order Request Body
      required:
      - nonce
      - pair
      - type
      - ordertype
      - volume
      type: object
      properties:
        nonce:
          $ref: '#/components/schemas/nonce'
        userref:
          description: 'This is an optional non-unique, numeric identifier which can associated with a number of orders by the client. This field is mutually exclusive with <code>cl_ord_id</code> parameter.


            `userref` is an optional user-specified integer id that can be associated with any number of orders. Many clients choose a `userref` corresponding to a unique integer id generated by their systems (e.g. a timestamp). However, because we don''t enforce uniqueness on our side, it can also be used to easily group orders by pair, side, strategy, etc. This allows clients to more readily cancel or query information about orders in a particular group, with fewer API calls by using `userref` instead of our `txid`, where supported.

            '
          type: integer
          format: int32
        cl_ord_id:
          description: "Adds an alphanumeric client order identifier which uniquely identifies an open order for each client. This field is mutually exclusive with <code>userref</code> parameter.\n\nThe <code>cl_ord_id</code> parameter can be one of the following formats:\n  * &bull; Long UUID: <code>6d1b345e-2821-40e2-ad83-4ecb18a06876</code> 32 hex characters separated with 4 dashes.\n  * &bull; Short UUID: <code>da8e4ad59b78481c93e589746b0cf91f</code> 32 hex characters with no dashes.\n  * &bull; Free text: <code>arb-20240509-00010</code> Free format ascii text up to 18 characters.\n"
          type: string
        ordertype:
          $ref: '#/components/schemas/ordertype'
        type:
          description: Order direction (buy/sell)
          type: string
          enum:
          - buy
          - sell
        volume:
          description: 'Order quantity in terms of the base asset

            > Note: Volume can be specified as `0` for closing margin orders to automatically fill the requisite quantity.

            '
          type: string
          example: '1.25'
        displayvol:
          description: 'For `iceberg` orders only, it defines the quantity to show in the book while the rest of order quantity remains hidden. Minimum value is 1 / 15 of `volume`.

            '
          type: string
        pair:
          description: Asset pair `id` or `altname`
          type: string
          example: XBTUSD
        asset_class:
          description: This parameter is required on requests for non-crypto pairs, i.e. use `tokenized_asset` for xStocks.
          type: string
          enum:
          - tokenized_asset
        price:
          description: 'Price:

            * &bull; Limit price for `limit` and `iceberg` orders

            * &bull; Trigger price for `stop-loss`, `stop-loss-limit`, `take-profit`, `take-profit-limit`, `trailing-stop` and `trailing-stop-limit` orders


            Notes:

            * &bull; Relative Prices: Either `price` or `price2` can be preceded by `+`, `-`, or `#` to specify the order price as an offset relative to the last traded price. `+` adds the amount to, and `-` subtracts the amount from the last traded price. `#` will either add or subtract the amount to the last traded price, depending on the direction and order type used. Prices can also be suffixed with a `%` to signify the relative amount as a percentage, rather than an absolute price difference.

            * &bull; Trailing Stops: Must use a relative price for this field, namely the `+` prefix, from which the direction will be automatic based on if the original order is a buy or sell (no need to use `-` or `#`). The `%` suffix also works for these order types to use a relative percentage price.

            '
          type: string
          example: '40000.0'
        price2:
          description: 'Secondary Price:

            * &bull; Limit price for `stop-loss-limit`, `take-profit-limit` and `trailing-stop-limit` orders


            Note:

            * &bull; Trailing Stops: Must use a relative price for this field, namely one of the `+` or `-` prefixes. This will provide the offset from the trigger price to the limit price, i.e. +0 would set the limit price equal to the trigger price. The `%` suffix also works for this field to use a relative percentage limit price.

            '
          type: string
        trigger:
          description: 'Price signal used to trigger `stop-loss`, `stop-loss-limit`, `take-profit`, `take-profit-limit`, `trailing-stop` and `trailing-stop-limit` orders


            Notes:

            * &bull; This `trigger` type will also be used for any associated conditional close orders.

            * &bull; To keep triggers serviceable, the last price will be used as fallback reference price during connectivity issues with external index feeds.

            '
          type: string
          enum:
          - index
          - last
          default: last
        leverage:
          description: 'Amount of leverage desired (default: none)'
          type: string
          example: 5
        reduce_only:
          description: If `true`, order will only reduce a currently open position, not increase it or open a new position.
          type: boolean
          default: false
          example: true
        stptype:
          description: 'Self Trade Prevention (STP) is a protection feature to prevent users from inadvertently or deliberately trading against themselves. To prevent a self-match, one of the following STP modes can be used to define which order(s) will be expired:

            * &bull; `cancel-newest`: arriving order will be canceled

            * &bull; `cancel-oldest`: resting order will be canceled

            * &bull; `cancel-both`: both arriving and resting orders will be canceled

            '
          type: string
          enum:
          - cancel-newest
          - cancel-oldest
          - cancel-both
          default: cancel-newest
        oflags:
          $ref: '#/components/schemas/oflags'
        timeinforce:
          description: 'Time-in-force of the order to specify how long it should remain in the order book before being cancelled. GTC (Good-''til-cancelled) is default if the parameter is omitted. IOC (immediate-or-cancel) will immediately execute the amount possible and cancel any remaining balance rather than resting in the book. GTD (good-''til-date), if specified, must coincide with a desired `expiretm`. FOK (fill-or-kill) will execute the full order immediately or cancel it entirely.

            '
          type: string
          enum:
          - GTC
          - IOC
          - GTD
          - FOK
          default: GTC
        starttm:
          description: "Scheduled start time, can be specified as an absolute timestamp or as a number of seconds in the future:\n  * &bull; `0` now (default)\n  * &bull; `<n>` = unix timestamp of start time\n  * &bull; `+<n>` = schedule start time `<n>` seconds from now\n    * Note that URL encoding of the `+` character changes it to a space, so please use `%2b` followed by the number of seconds instead of `+`\n"
          type: string
        expiretm:
          description: "Expiry time on GTD orders can be set up to one month in future, it is specified as an absolute timestamp or as a number of seconds from now:\n  * &bull; `0` no expiration (default)\n  * &bull; `<n>` = unix timestamp of expiration time\n  * &bull; `+<n>` = expire `<n>` seconds from now, minimum 5 seconds\n    * Note that URL encoding of the `+` character changes it to a space, so please use `%2b` followed by the number of seconds instead of `+`\n"
          type: string
        close[ordertype]:
          description: "Conditional close order type \n> Note: [Conditional close orders](https://support.kraken.com/hc/en-us/articles/360038640052-Conditional-Close) are triggered by execution of the primary order in the same quantity and opposite direction, but once triggered are __independent orders__ that may reduce or increase net position\n"
          type: string
