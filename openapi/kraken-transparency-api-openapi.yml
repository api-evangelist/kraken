openapi: 3.2.0
info:
  title: REST Transparency API
  version: 1.1.0
  description: ''
servers:
- url: https://api.kraken.com/0
  description: Production Server
security:
- API-Key: []
  API-Sign: []
tags:
- name: Transparency
paths:
  /public/PreTrade:
    get:
      summary: Pre-Trade Data
      description: 'Returns the price levels in the order book with aggregated order quantities at each price level.

        The top 10 levels are returned for each trading pair.'
      tags:
      - Transparency
      operationId: getPreTrade
      security: []
      parameters:
      - name: symbol
        in: query
        required: true
        description: A list of symbols for the currency pairs.
        example: BTC/USD
        schema:
          type: string
          minLength: 3
          maxLength: 32
      responses:
        '200':
          description: The top price levels of the aggregated order book.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pre-trade'
  /public/PostTrade:
    get:
      summary: Post-Trade Data
      description: 'Returns a list of trades on the spot exchange.

        If no filter parameters are specified, the last 1000 trades for all pairs are received.'
      tags:
      - Transparency
      operationId: getPostTrade
      security: []
      parameters:
      - name: symbol
        in: query
        required: false
        description: Filter the results to the currency pair.
        example: BTC/USD
        schema:
          type: string
      - name: from_ts
        in: query
        description: Filter the results to include the trades *after* this timestamp.
        required: false
        example: '2024-05-30T12:34:56.123456789Z'
        schema:
          type: string
          format: ISO 8601
      - name: to_ts
        in: query
        description: Filter the results to include the trades *before or at* this timestamp.
        required: false
        example: '2024-05-30T12:34:56.123456789Z'
        schema:
          type: string
          format: ISO 8601
      - name: count
        in: query
        required: false
        description: The maximum number of trades to return.
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 1000
      responses:
        '200':
          description: Post-trade data retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/post-trade'
components:
  schemas:
    pre-trade:
      title: PreTradeResponse
      type: object
      properties:
        result:
          description: An aggregated order book.
          type: object
          properties:
            symbol:
              type: string
              maxLength: 32
              description: The symbol of the currency pair.
              example: BTC/USD
            description:
              type: string
              maxLength: 350
              description: The full description of the currency pair.
              example: Bitcoin / US Dollars
            base_asset:
              type: string
              format: ISO 4217
              description: Currency code for the base asset.
              example: BTC
            base_dti_code:
              type: string
              description: Digital Token Identifier (DTI) code for the base asset.
            base_dti_short_name:
              type: string
              description: DTI short name for the base asset.
            quote_dti_code:
              type: string
              description: Digital Token Identifier (DTI) code for the quote asset.
            quote_dti_short_name:
              type: string
              description: DTI short name for the quote asset.
            base_notation:
              type: string
              description: Indicates how the quantity is expressed.
              enum:
              - UNIT
              - NOML
            quote_asset:
              type: string
              format: ISO 4217
              description: Currency in which the trading price is expressed.
              example: USD
            quote_notation:
              type: string
              description: Indicates that the price is expressed in monetary value.
              enum:
              - MONE
            venue:
              type: string
              format: ISO 10383
              description: Market Identifier Code (MIC) of the trading platform where the order was submitted.
              enum:
              - PGSL
            system:
              type: string
              description: Indicates the order system is a Central Limit Order Book.
              enum:
              - CLOB
            bids:
              type: array
              items:
                type: object
                properties:
                  side:
                    type: string
                    description: Indicates whether the price level is a bid (BUY) or offer (SELL).
                    enum:
                    - BUY
                  price:
                    type: string
                    description: Price level in the Central Limit Order Book (CLOB).
                    example: '102002.1'
                  qty:
                    type: string
                    description: The aggregated quantity at the price level.
                    example: '102002.1'
                  count:
                    type: integer
                    description: The number of orders in the price level.
                    minLength: 1
                  submission_ts:
                    type: string
                    format: ISO 8601
                    description: Timestamp the order at this price level was submitted.
                    example: '2024-05-30T12:34:56.123456Z'
                  publication_ts:
                    type: string
                    format: ISO 8601
                    description: Timestamp the price level was last updated and published.
                    example: '2024-05-30T12:34:56.123456Z'
            asks:
              type: array
              items:
                type: object
                properties:
                  side:
                    type: string
                    description: Indicates whether the price level is a bid (BUY) or offer (SELL).
                    enum:
                    - SELL
                  price:
                    type: string
                    description: Price level in the Central Limit Order Book (CLOB).
                    example: '102002.1'
                  qty:
                    type: string
                    description: The aggregated quantity at the price level.
                    example: '102002.1'
                  count:
                    type: integer
                    description: The number of orders in the price level.
                    minLength: 1
                  submission_ts:
                    type: string
                    format: ISO 8601
                    description: Timestamp the order at this price level was submitted.
                    example: '2024-05-30T12:34:56.123456Z'
                  publication_ts:
                    type: string
                    format: ISO 8601
                    description: Timestamp the price level was last updated and published.
                    example: '2024-05-30T12:34:56.123456Z'
        error:
          $ref: '#/components/schemas/error'
    post-trade:
      title: PostTradeResponse
      description: A list of trades. A maximum of `count` trades will be returned in a single query, as specified in the query parameters.
      type: object
      properties:
        result:
          type: object
          properties:
            last_ts:
              type: string
              format: ISO 8601
              description: "Timestamp of the latest trade in the list. \nThis field can be used as the `from_ts` parameter when requesting the next batch of trades.\n"
              example: '2024-05-30T12:34:56.123456789Z'
            count:
              type: integer
              description: The number of trades returned.
              minimum: 0
              maximum: 1000
            trades:
              type: array
              description: A list of trades in ascending timestamp order.
              items:
                type: object
                format: Trade
                minItems: 0
                maxItems: 1000
                properties:
                  trade_id:
                    type: string
                    maxLength: 19
                    description: Kraken unique trade identifier.
                    example: TGBB7L-HT5LX-J3BZ4A
                  price:
                    type: string
                    description: Trade price excluding fees and commissions.
                    example: '102002.1'
                  quantity:
                    type: string
                    description: Unconsolidated trade quantity from execution.
                    example: '1.24'
                  symbol:
                    type: string
                    maxLength: 32
                    description: The symbol of the currency pair.
                    example: BTC/USD
                  description:
                    type: string
                    maxLength: 350
                    description: The full description of the currency pair.
                    example: Bitcoin / US Dollars
                  base_asset:
                    type: string
                    format: ISO 4217
                    description: Currency code for the base asset.
                    example: BTC
                  base_notation:
                    type: string
                    description: Indicates that the quantity is expressed in nominal value.
                    enum:
                    - UNIT
                  quote_asset:
                    type: string
                    format: ISO 4217
                    description: Currency in which the trading price is expressed.
                    example: USD
                  quote_notation:
                    type: string
                    description: Indicates that the price is expressed in monetary value.
                    enum:
                    - MONE
                  trade_venue:
                    type: string
                    format: ISO 10383
                    maxLength: 12
                    description: Market Identifier Code (MIC) of the trading platform where the trade was executed.
                    example: PGSL
                  trade_ts:
                    type: string
                    format: ISO 8601
                    description: Timestamp the trade was matched in the engine to microsecond precision.
                    example: '2024-05-30T12:34:56.123456789Z'
                  publication_venue:
                    type: string
                    format: ISO 10383
                    maxLength: 12
                    description: Market Identifier Code (MIC) of the trading platform where the trade was published.
                    example: PGSL
                  publication_ts:
                    type: string
                    format: ISO 8601
                    description: Timestamp the trade was published to market data streams.
                    example: '2024-05-30T12:34:56.123456789Z'
        error:
          $ref: '#/components/schemas/error'
    error:
      type: array
      items:
        description: Kraken API error
        type: string
        example: EGeneral:Invalid arguments
  securitySchemes:
    API-Key:
      type: apiKey
      description: The "API-Key" header should contain your API key.
      name: API-Key
      in: header
    API-Sign:
      type: apiKey
      description: Authenticated requests should be signed with the "API-Sign" header, using a signature generated with your private key, nonce, encoded payload, and URI path.
      name: API-Sign
      in: header
    API-Nonce:
      type: apiKey
      description: The "API-Nonce" header should contain an always-increasing 64-bit integer, most commonly a Unix timestamp in milliseconds. Each request must use a nonce greater than the nonce of the previous request signed with the same API key.
      name: API-Nonce
      in: header
    API-OTP:
      type: apiKey
      description: The "API-OTP" header should contain your two-factor authentication one-time password. Required only if 2FA is configured for the API key.
      name: API-OTP
      in: header
x-tagGroups:
- name: Public Endpoints
  tags:
  - Market Data
  - Transparency
- name: Authenticated Endpoints
  tags:
  - Account Data
  - Trading
  - funding-beta
  - Funding
  - Subaccounts
  - Earn
x-provenance:
  method: harvested
  publisher: Kraken
  source: https://www.kraken.com/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
