  /private/TradeVolume:
    post:
      summary: Get Trade Volume
      description: 'Returns 30 day USD trading volume and resulting fee schedule for any asset pair(s) provided. Fees will not be included if `pair` is not specified as Kraken fees differ by asset pair.

        Note: If an asset pair is on a maker/taker fee schedule, the taker side is given in `fees` and maker side in `fees_maker`. For pairs not on maker/taker, they will only be given in `fees`.


        `pair` accepts either a comma-delimited list of pair names or a list of `{ asset, aclass }` objects (the latter is required for non-forex classes such as `derivatives` or `equity_pair`). Set `fee_schedule` to `true` to additionally receive the full fee schedule per trading pair in the `schedules` field.


        **API Key Permissions Required:** `Funds permissions - Query`'
      tags:
      - Account Data
      operationId: getTradeVolume
      requestBody:
        $ref: '#/components/requestBodies/volume'
      responses:
        '200':
          description: Trade Volume retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/volume'
                example:
                  error: []
                  result:
                    currency: ZUSD
                    asset_class: currency
                    volume: '200709587.4223'
                    inputs:
                      domain_spot_volume_30d: '200709587.4223'
                      domain_futures_volume_30d: '0.0000'
                      domain_assets_on_platform: '0.0000'
                    fees:
                      XXBTZUSD:
                        fee: '0.1000'
                        minfee: '0.1000'
                        maxfee: '0.2600'
                        nextfee: null
                        tiervolume: '10000000.0000'
                        nextvolume: null
                    fees_maker:
                      XXBTZUSD:
                        fee: '0.0000'
                        minfee: '0.0000'
                        maxfee: '0.1600'
                        nextfee: null
                        tiervolume: '10000000.0000'
                        nextvolume: null
      security:
      - API-Key: []
        API-Sign: []
    servers:
    - url: https://api.kraken.com/0
      description: Production Server
  /private/AddExport:
    post:
      summary: Request Export Report
      description: 'Request export of trades or ledgers.


        **API Key Permissions Required:** `Data - Export data`'
      tags:
      - Account Data
      operationId: addExport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
              - nonce
              - report
              - description
              properties:
                nonce:
                  $ref: '#/components/schemas/nonce'
                report:
                  type: string
                  description: Type of data to export
                  enum:
                  - trades
                  - ledgers
                format:
                  type: string
                  description: File format to export
                  enum:
                  - CSV
                  - TSV
                  default: CSV
                description:
                  type: string
                  description: Description for the export
                fields:
                  type: string
                  default: all
                  description: 'Comma-delimited list of fields to include


                    * `trades`: `ordertxid`, `time`, `ordertype`, `price`, `cost`, `fee`, `vol`, `margin`, `misc`, `ledgers`

                    * `ledgers`: `refid`, `time`, `type`, `subtype`, `aclass`, `asset`, `amount`, `fee`, `balance`, `wallet`

                    '
                starttm:
                  type: integer
                  description: UNIX timestamp for report start time (default 1st of the current month)
                endtm:
                  type: integer
                  description: UNIX timestamp for report end time (default now)
              example:
                nonce: 1695828490
                report: trades
                description: yearly report
                format: CSV
                starttm: 1695728276
                endtm: 1695828276
      responses:
        '200':
          description: Export request made
          content:
            application/json:
              schema:
                properties:
                  result:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Report ID
                  error:
                    $ref: '#/components/schemas/error'
                example:
                  error: []
                  result:
                    id: TCJA
      security:
      - API-Key: []
        API-Sign: []
    servers:
    - url: https://api.kraken.com/0
      description: Production Server
  /private/ExportStatus:
    post:
      summary: Get Export Report Status
      description: 'Get status of requested data exports.


        **API Key Permissions Required:** `Data - Export data`'
      tags:
      - Account Data
      operationId: exportStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
              - nonce
              - report
              properties:
                nonce:
                  $ref: '#/components/schemas/nonce'
                report:
                  type: string
                  description: Type of reports to inquire about
                  enum:
                  - trades
                  - ledgers
              example:
                nonce: 1695828490
                report: trades
      responses:
        '200':
          description: Export status retrieved
          content:
            application/json:
              schema:
                properties:
                  result:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Report ID
                        descr:
                          type: string
                        format:
                          type: string
                        report:
                          type: string
                        subtype:
                          type: string
                        status:
                          type: string
                          description: Status of the report
                          enum:
                          - Queued
                          - Processing
                          - Processed
                        error:
                          type: string
                          description: Error of the report
                          enum:
                          - EExport:Internal error
                          - EExport:Unexpected error
                          - EExport:Canceled
                          - EExport:Deleted
                          - EExport:Exported size too big
                        flags:
                          type: string
                          deprecated: true
                        fields:
                          type: string
                        createdtm:
                          type: string
                          description: UNIX timestamp of report request
                        expiretm:
                          type: string
                          deprecated: true
                        starttm:
                          type: string
                          description: UNIX timestamp report processing began
                        completedtm:
                          type: string
                          description: UNIX timestamp report processing finished
                        datastarttm:
                          type: string
                          description: UNIX timestamp of the report data start time
                        dataendtm:
                          type: string
                          description: UNIX timestamp of the report data end time
                        aclass:
                          type: string
                          deprecated: true
                        asset:
                          type: string
                        asset_classes:
                          type: array
                          description: Asset classes included in the report
                          items:
                            type: string
                        endtm:
                          type: string
                          description: UNIX timestamp of the report end time
                        delete:
                          type: boolean
                          description: Whether the report is pending deletion
                  error:
                    $ref: '#/components/schemas/error'
                example:
                  error: []
                  result:
                  - id: VSKC
                    descr: my_trades_1
                    format: CSV
                    report: trades
                    subtype: all
                    status: Processed
                    flags: '0'
                    fields: all
                    createdtm: '1688669085'
                    expiretm: '1688878685'
                    starttm: '1688669093'
                    completedtm: '1688669093'
                    datastarttm: '1683556800'
                    dataendtm: '1688669085'
                    aclass: forex
                    asset: all
                  - id: TCJA
                    descr: my_trades_1
                    format: CSV
                    report: trades
                    subtype: all
                    status: Processed
                    flags: '0'
                    fields: all
                    createdtm: '1688363637'
                    expiretm: '1688573237'
                    starttm: '1688363664'
                    completedtm: '1688363664'
                    datastarttm: '1683235200'
                    dataendtm: '1688363637'
                    aclass: forex
                    asset: all
      security:
      - API-Key: []
        API-Sign: []
    servers:
    - url: https://api.kraken.com/0
      description: Production Server
