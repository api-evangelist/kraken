        equity_usd:
          description: Total collateral - total credit (in USD)
          type:
          - string
          - 'null'
          example: '125000.0000'
        ongoing_balance:
          description: Total collateral / total credit (in USD)
          type:
          - string
          - 'null'
          example: '1.5000'
        debt_to_equity:
          description: Total credit used / equity (in USD)
          type:
          - string
          - 'null'
          example: '0.2000'
    query-3:
