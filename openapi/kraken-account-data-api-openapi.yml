components:
  requestBodies:
    nonceOnly:
      required: true
      content:
        application/json:
          schema:
            required:
            - nonce
            type: object
            properties:
              nonce:
                $ref: '#/components/schemas/nonce'
            example:
              nonce: 1695828436
    closedOrders:
      required: true
      content:
        application/json:
          schema:
            title: Get Closed Orders Request Body
            required:
            - nonce
            type: object
            properties:
              nonce:
                $ref: '#/components/schemas/nonce'
              trades:
                description: Whether or not to include trades related to position in output
                type: boolean
                default: false
              userref:
                description: Restrict results to given user reference
                type: integer
                format: int32
              cl_ord_id:
                description: Restrict results to given client order id
                type: string
              start:
                description: Starting unix timestamp or order tx ID of results (exclusive)
                type: integer
              end:
                description: Ending unix timestamp or order tx ID of results (inclusive)
                type: integer
              ofs:
                description: Result offset for pagination. Deprecated, use `with_cursor` and `cursor` instead. Must be absent or `0` when `with_cursor` is `true`.
                type: integer
                deprecated: true
              with_cursor:
                description: Use cursor-based pagination instead of `ofs`. Each page holds up to 50 orders, and the response includes `cursor.next` when more orders are available.
                type: boolean
                default: false
              cursor:
                description: Opaque pagination token from `cursor.next` of the previous page. Requires `with_cursor`.
                type: string
              closetime:
                description: 'Which time field is used when filtering results:

                  - `open`: Uses the `opentm` field only (`start < opentm && opentm <= end`)

                  - `close`: Uses the `closetm` field only (`start < closetm && closetm <= end`)

                  - `both`: Requires both times to fall within the range (`start < opentm && closetm <= end`)

                  '
                type: string
                enum:
                - open
                - close
                - both
                default: both
              consolidate_taker:
                description: Whether or not to consolidate trades by individual taker trades
                type: boolean
                default: true
              without_count:
                description: If true, does not retrieve the count of closed orders (`count` is returned as `0`, as it is when `with_cursor` is `true`). Request can be noticeably faster for users with many closed orders as this avoids an extra database query.
                type: boolean
                default: false
              rebase_multiplier:
                $ref: '#/components/schemas/rebase_multiplier'
            example:
              nonce: 1234567
              trades: true
              cl_ord_id: 9cc788d8-9c00-4b25-94d3-26d93603948d
              start: 1695728276
              end: 1695828276
              closetime: open
    balance:
      required: true
      content:
        application/json:
          schema:
            title: Update Account Profile Request
            description: Update Account Profile Request Body
            required:
            - nonce
            type: object
            properties:
              nonce:
                $ref: '#/components/schemas/nonce'
              asset:
                description: Base asset used to determine balance
                type: string
                default: ZUSD
              rebase_multiplier:
                $ref: '#/components/schemas/rebase_multiplier'
            example:
              nonce: 1695828490
              asset: ZUSD
    info:
      required: true
      content:
        application/json:
          schema:
            title: Get Ledgers Info Request Body
            required:
            - nonce
            type: object
            properties:
              nonce:
                $ref: '#/components/schemas/nonce'
              asset:
                description: 'Filter output by asset. Accepts one of the following formats:

                  * `all`, a single asset, or a comma delimited list of assets.

                  * A list of `{ asset, aclass }` objects, to filter by assets of a specific asset class (e.g. `tokenized_asset`).

                  '
                default: all
                anyOf:
                - type: string
                  title: Comma-delimited list
                  description: '`all`, or a comma delimited list of asset names.'
                - type: array
                  title: List of assets with class
                  description: List of `{ asset, aclass }` objects.
                  items:
                    type: object
                    required:
                    - asset
                    - aclass
                    properties:
                      asset:
                        description: Asset name.
                        type: string
                      aclass:
                        description: Asset class of the asset.
                        type: string
                        enum:
                        - currency
                        - forex
                        - equity
                        - equity_pair
                        - nft
                        - derivatives
                        - tokenized_asset
                        - futures_contract
              aclass:
                description: Filter output by asset class. Deprecated, use the `{ asset, aclass }` list form of `asset` instead.
                type: string
                default: currency
                deprecated: true
              type:
                description: Type of ledger to retrieve
                type: string
                default: all
                enum:
                - all
                - trade
                - deposit
                - withdrawal
                - transfer
                - margin
                - adjustment
                - rollover
                - credit
                - settled
                - staking
                - dividend
                - sale
                - nft_rebate
              start:
                description: Starting unix timestamp or ledger ID of results (exclusive)
                type: integer
              end:
                description: Ending unix timestamp or ledger ID of results (inclusive)
                type: integer
              ofs:
                description: Result offset for pagination. Deprecated, use `with_cursor` and `cursor` instead. Must be absent or `0` when `with_cursor` is `true`.
                type: integer
                deprecated: true
              with_cursor:
                description: Use cursor-based pagination instead of `ofs`. Each page holds up to 50 ledger entries, and the response includes `cursor.next` when more entries are available. `start` and `end` still narrow the range. Skips the count query, so `count` is returned as `null`.
                type: boolean
                default: false
              cursor:
                description: Opaque pagination token from `cursor.next` of the previous page. Requires `with_cursor`.
                type: string
              without_count:
                description: If true, does not retrieve count of ledger entries (`count` is returned as `null`). Request can be noticeably faster for users with many ledger entries as this avoids an extra database query.
                type: boolean
                default: false
              rebase_multiplier:
                $ref: '#/components/schemas/rebase_multiplier'
            example:
              nonce: 1695828490
              type: trade
              start: 1695728276
              end: 1695828276
    volume:
      required: true
      content:
        application/json:
          schema:
            title: Get Trade Volume
            required:
            - nonce
            type: object
            properties:
              nonce:
                $ref: '#/components/schemas/nonce'
              pair:
                description: 'Asset pair(s) for which to retrieve fee info (optional, but required if any fee info is desired). Accepts one of the following formats:

                  * A comma-delimited list of pair names — each is looked up as a forex pair.

                  * A list of `{ asset, aclass }` objects (`pairs_with_class`). Required to request fees for non-forex classes such as `equity_pair`, `derivatives`, or `futures_contract`.

                  '
                anyOf:
                - type: string
                  title: Comma-delimited list
                  description: Comma-delimited list of pair names, each looked up as a forex pair.
                - type: array
                  title: List of pairs with class
                  description: List of `{ asset, aclass }` objects. Required for non-forex classes.
                  items:
                    type: object
                    required:
                    - asset
                    - aclass
                    properties:
                      asset:
                        description: The pair name. All result amounts will be expressed in units of this asset.
                        type: string
                      aclass:
                        description: The asset class of the pair.
                        type: string
                        enum:
                        - currency
                        - forex
                        - equity
                        - equity_pair
                        - nft
                        - derivatives
                        - tokenized_asset
                        - futures_contract
              fee-info:
                description: Whether or not to include fee info in the results (legacy parameter, accepted for backwards compatibility).
                default: false
                oneOf:
                - type: string
                  title: string
                - type: boolean
                  title: boolean
                - type: number
                  title: number
              fee_schedule:
                description: Whether to include the full fee schedule per trading pair in the response (returned in `schedules`).
                type:
                - boolean
                - 'null'
              rebase_multiplier:
                $ref: '#/components/schemas/rebase_multiplier'
            example:
              nonce: 1695828490
              pair:
              - asset: BTC/USD
                aclass: forex
              - asset: PF_XBTUSD
                aclass: derivatives
    openOrders:
      required: true
      content:
        application/json:
          schema:
            title: Get Open Orders Request Body
            required:
            - nonce
            type: object
            properties:
              nonce:
                $ref: '#/components/schemas/nonce'
              trades:
                description: Whether or not to include trades related to position in output
                type: boolean
                default: false
              userref:
                description: Restrict results to given user reference
                type: integer
                format: int32
              cl_ord_id:
                description: Restrict results to given client order id
                type: string
              consolidate_taker:
                description: Whether or not to consolidate trades by individual taker trades
                type: boolean
                default: true
              with_cursor:
                description: Use cursor-based pagination. Each page then holds at most `limit` orders, and the response includes `cursor.next` when more orders are available.
                type: boolean
                default: false
              limit:
                description: Maximum number of orders to return. When `with_cursor` is `true`, defaults to `50` and values above `100` are rejected. Otherwise all open orders are returned unless `limit` is set (capped at `1000`).
                type: integer
                minimum: 1
              cursor:
                description: Opaque pagination token from `cursor.next` of the previous page. Requires `with_cursor`.
                type: string
              rebase_multiplier:
                $ref: '#/components/schemas/rebase_multiplier'
            example:
              nonce: 1234567
              trades: true
              cl_ord_id: 9cc788d8-9c00-4b25-94d3-26d93603948d
    query-2:
      required: true
      content:
        application/json:
          schema:
            title: Get Ledger Info Request Body
            required:
            - nonce
            - id
            type: object
            properties:
              nonce:
                $ref: '#/components/schemas/nonce'
              id:
                description: Comma delimited list of ledger IDs to query info about (20 maximum)
                type: string
              trades:
                description: Whether or not to include trades related to position in output. Deprecated, do not rely on this parameter.
                type: boolean
                default: false
                deprecated: true
              rebase_multiplier:
                $ref: '#/components/schemas/rebase_multiplier'
            example:
              nonce: 1695828490
              id: LUI2RA-CJFLB-EN5I4P, L2QE42-IGSZ3-WEVTLK
    history:
      required: true
      content:
        application/json:
          schema:
            title: Get Trades History Request Body
            required:
            - nonce
            type: object
            properties:
              nonce:
                $ref: '#/components/schemas/nonce'
              type:
                description: Type of trade
                type: string
                default: all
                enum:
                - all
                - any position
                - closed position
                - closing position
                - no position
              trades:
                description: Whether or not to include trades related to position in output
                type: boolean
                default: false
              start:
                description: Starting unix timestamp or trade tx ID of results (exclusive)
                type: integer
              end:
                description: Ending unix timestamp or trade tx ID of results (inclusive)
                type: integer
              ofs:
                description: Result offset for pagination. Deprecated, use `with_cursor` and `cursor` instead. Must be absent or `0` when `with_cursor` is `true`.
                type: integer
                deprecated: true
              without_count:
                description: If true, does not retrieve count of trades. Request can be noticeably faster for users with many trades as this avoids an extra database query.
                type: boolean
                default: false
              consolidate_taker:
                description: Whether or not to consolidate trades by individual taker trades
                type: boolean
                default: true
              ledgers:
                description: 'Whether or not to include related ledger ids for given trade

                  <br><sub><sup>Note that setting this to true will slow request performance</sub></sup>

                  '
                type: boolean
                default: false
              rebase_multiplier:
                $ref: '#/components/schemas/rebase_multiplier'
              aclass:
                description: Asset class of the `pair` filter.
                type: string
                default: forex
                enum:
                - forex
                - equity_pair
                - futures_contract
                - synthetic_pair
                - external_pair
              pair:
                description: Filter results to a single trading pair. An unrecognized pair returns `EQuery:Unknown asset pair`.
                type: string
              limit:
                description: Number of trades returned per page (1–100). Values above 100 get clamped to 100.
                type: integer
                default: 50
                minimum: 1
                maximum: 100
              with_cursor:
                description: Use cursor-based pagination instead of `ofs`. The response then includes `cursor.next` when more trades are available.
                type: boolean
                default: false
              cursor:
                description: Opaque pagination token from `cursor.next` of the previous page. Requires `with_cursor`.
                type: string
            example:
              nonce: 1695828490
              type: all
              trades: false
              consolidate_taker: true
              pair: BTC/USD
              limit: 75
    query:
      required: true
      content:
        application/json:
          schema:
            title: Get Trades Info Request Body
            required:
            - nonce
            - txid
            type: object
            properties:
              nonce:
                $ref: '#/components/schemas/nonce'
              txid:
                description: Comma delimited list of transaction IDs to query info about (20 maximum)
                type: string
              trades:
                description: Whether or not to include trades related to position in output
                type: boolean
                default: false
              ledgers:
                description: Whether or not to include related ledger ids for given trade
                type: boolean
                default: false
              rebase_multiplier:
                $ref: '#/components/schemas/rebase_multiplier'
            example:
              nonce: 1695828490
              txid: L2QE42-IGSZ3-WEVTLK, STMH53C-C54CG-4SO42I
              trades: false
  schemas:
