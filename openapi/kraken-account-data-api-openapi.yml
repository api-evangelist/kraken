      description: Production Server
  /private/GetApiKeyInfo:
    post:
      summary: Get API Key Info
      description: 'Retrieve information about the API key that is used to make the request, including its name, permissions, restrictions, and usage timestamps.


        **API Key Permissions Required:** `None`'
      tags:
      - Account Data
      operationId: getApiKeyInfo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nonce:
                  $ref: '#/components/schemas/nonce'
                otp:
                  type: string
                  description: Two-factor authentication password (required only if 2FA is configured for the API key)
              required:
              - nonce
      responses:
        '200':
          description: API key information retrieved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    title: ApiKeyInfo
                    description: API Key Information
                    type: object
                    properties:
                      api_key_name:
                        type: string
                        description: Name/label assigned to the API key
                      api_key:
                        type: string
                        description: The API key string
                      nonce:
                        type: string
                        description: Current nonce value for the API key
                      nonce_window:
                        type: integer
                        format: int64
                        description: Custom nonce window value (0 if not configured)
                      permissions:
                        type: array
                        items:
                          type: string
                        description: 'List of permissions assigned to the API key. Values correspond to the API Key permission settings:


                          | Value | API Key Permission |

                          |---|---|

                          | `query-funds` | Funds permissions - Query |

                          | `add-funds` | Funds permissions - Deposit |

                          | `withdraw-funds` | Funds permissions - Withdraw |

                          | `earn-funds` | Funds permissions - Earn |

                          | `query-open-trades` | Orders and trades - Query open orders & trades |

                          | `query-closed-trades` | Orders and trades - Query closed orders & trades |

                          | `modify-trades` | Orders and trades - Create & modify orders |

                          | `close-trades` | Orders and trades - Cancel & close orders |

                          | `query-ledger` | Data - Query ledger entries |

                          | `export-data` | Data - Export data |

                          | `create-ws-token` | WebSocket interface - On |

                          | `add-withdraw-address` | Add withdrawal addresses |

                          | `update-withdraw-address` | Update withdrawal addresses |

                          '
                      iban:
                        type: string
                        description: IIBAN (Internal IBAN) of the account associated with the API key
                      valid_until:
                        type: string
                        description: Unix timestamp for key expiration (0 if not set)
                      query_from:
                        type: string
                        description: Unix timestamp for earliest allowed query date (0 if not set)
                      query_to:
                        type: string
                        description: Unix timestamp for latest allowed query date (0 if not set)
                      created_time:
                        type: string
                        description: Unix timestamp of when the API key was created
                      modified_time:
                        type: string
                        description: Unix timestamp of when the API key was last modified
                      ip_allowlist:
                        type: array
                        items:
                          type: string
                        description: List of IP addresses or ranges allowed to use this API key (empty if not restricted)
                      last_used:
                        type:
                        - string
                        - 'null'
                        description: Unix timestamp of when the API key was last used (null if never used)
                  error:
                    $ref: '#/components/schemas/error'
                example:
                  error: []
                  result:
                    apiKeyName: my-api-key
                    apiKey: 4/SDrDBcOOPnm3nPlNfEMMJDeRcIVqPz+QhRxIodyZbI9po/aVRiHsgX
                    nonce: '1772627060997'
                    nonceWindow: 0
                    permissions:
                    - query-funds
                    - withdraw-funds
                    - query-open-trades
                    - modify-trades
                    iban: AA88 N84G WOAK NMOI
                    validUntil: '0'
                    queryFrom: '0'
                    queryTo: '0'
                    createdTime: '1772542900'
                    modifiedTime: '1772543095'
                    ipAllowlist: []
                    lastUsed: '1772627061'
      security:
      - API-Key: []
        API-Sign: []
    servers:
    - url: https://api.kraken.com/0
      description: Production Server
  /private/ListWalletAccounts:
    post:
      summary: List Wallet Accounts
      description: 'Retrieve the wallet accounts associated with the authenticated user.


        Each wallet account includes a public `account_id` that identifies that wallet. Other endpoints that accept `account_id` (for example `Balance`, `Ledgers`, and Funding (Beta) requests) use this value to select a specific wallet.


        **API Key Permissions Required:** `None`'
      tags:
      - Account Data
      operationId: listWalletAccounts
      requestBody:
        $ref: '#/components/requestBodies/nonceOnly'
      responses:
        '200':
          description: Wallet accounts retrieved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    required:
                    - accounts
                    - cursor
                    properties:
                      accounts:
                        type: array
                        description: Wallet accounts for the authenticated user.
                        items:
                          type: object
                          required:
                          - account_id
                          - flags
                          - status
                          - type
                          properties:
                            account_id:
                              type: string
                              description: Public wallet account ID.
                              example: WX6V-JUKW-KKPB-QE36
                            flags:
                              type: object
                              required:
                              - user_defined
                              - active
                              properties:
                                user_defined:
                                  type: boolean
                                  description: Whether the wallet was created by the user. System-created wallets are `false`.
                                active:
                                  type: boolean
                                  description: Whether the wallet is currently active.
                            status:
                              type: string
                              description: Wallet lifecycle status.
                              enum:
                              - active
                              - disabled
                              - closed
                              - unknown
                            type:
                              type: string
                              description: 'Wallet account type:


                                | Value | Description |

                                |---|---|

                                | `main` | Primary account |

                                | `spot` | Spot account |

                                | `pay` | Pay account |

                                | `prop_paper` | Prop paper account |

                                | `prop_real` | Prop real account |

                                | `unknown` | Other account |

                                '
                              enum:
                              - main
                              - spot
                              - pay
                              - prop_paper
                              - prop_real
                              - unknown
                            name:
                              type:
                              - string
                              - 'null'
                              description: Optional display name for the wallet.
                      cursor:
                        type: object
                        description: Pagination cursor. `next` is `null` when there are no further pages.
                        properties:
                          next:
                            type:
                            - string
                            - 'null'
                            description: Opaque cursor for the next page of results.
                  error:
                    $ref: '#/components/schemas/error'
                example:
                  error: []
                  result:
                    accounts:
                    - account_id: WX6V-JUKW-KKPB-QE36
                      flags:
                        user_defined: false
                        active: true
                      status: active
                      type: main
                      name: null
                    cursor:
                      next: null
      security:
      - API-Key: []
        API-Sign: []
    servers:
    - url: https://api.kraken.com/0
      description: Production Server
  /0/private/Balance:
    post:
      operationId: post0PrivateBalance
      summary: Kraken Get Account Balance
      description: Returns the asset balances held in the account.
      tags:
      - Account Data
      security:
