openapi: 3.2.0
info:
  title: Kraken Account Data API
  x-refined-note:
  - x-generated-from differs across the merged source definitions and was not carried
  - x-last-validated differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged Account Data across 2 of this provider''s published API definitions: kraken-openapi.json, kraken-spot-rest-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.kraken.com/0
  description: Production Server
- url: https://api.kraken.com
  description: Kraken Spot REST production endpoint
- url: https://colo-london.vip-api.kraken.com
  description: Kraken Spot REST colocation endpoint (London VIP)
tags:
- name: Account Data
paths:
  /private/Balance:
    post:
      summary: Get Account Balance
      description: 'Retrieve all cash balances, net of pending withdrawals.


        Pass `account_id` to retrieve balances for a specific wallet. Omit it to use the authenticated user''s default wallet. Use List Wallet Accounts to obtain wallet account IDs.


        **Note on Staking/Earn assets:** We have begun to migrate assets from our legacy Staking system over to a new Earn system. As such, the following assets may appear in your balances and ledger. Please see our Support article for more details. Note that these assets are "read-only", to interact with your balances in them please use the base asset (e.g. `USDT` to transact with your `USDT` and `USDT.F` balances).


        **Symbol Extensions**:

        * `.B`: balances in new yield-bearing products, similar to `.S` (staked) and `.M` (opt-in rewards) balances

        * `.F`: balances earning automatically in Kraken Rewards

        * `.T`: tokenized assets.


        **API Key Permissions Required:** `Funds permissions - Query`'
      tags:
      - Account Data
      operationId: getAccountBalance
      parameters:
      - $ref: '#/components/parameters/account_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nonce:
                  $ref: '#/components/schemas/nonce'
                rebase_multiplier:
                  $ref: '#/components/schemas/rebase_multiplier'
              required:
              - nonce
      responses:
        '200':
          description: Account balances retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/balance-2'
                example:
                  error: []
                  result:
                    ZUSD: '171288.6158'
                    ZEUR: '504861.8946'
                    XXBT: '1011.1908877900'
                    XETH: '818.5500000000'
                    USDT: '500000.00000000'
                    DAI: '9999.9999999999'
                    DOT: '2.5000000000'
                    ETH2.S: '198.3970800000'
                    ETH2: '2.5885574330'
                    USD.M: '1213029.2780'
      security:
      - API-Key: []
        API-Sign: []
    servers:
    - url: https://api.kraken.com/0
      description: Production Server
  /private/BalanceEx:
    post:
      summary: Get Extended Balance
      description: 'Retrieve all extended account balances, including credits and held amounts. Balance available for trading is calculated as: `available balance = balance + credit - credit_used - hold_trade`


        Note that held amounts only include spot non margin orders.


        **Note on Staking/Earn assets:** We have begun to migrate assets from our legacy Staking system over to a new Earn system. As such, the following assets may appear in your balances and ledger. Please see our Support article for more details. Note that these assets are "read-only", to interact with your balances in them please use the base asset (e.g. `USDT` to transact with your `USDT` and `USDT.F` balances).


        **Symbol Extensions**:

        * `.B`: balances in new yield-bearing products, similar to `.S` (staked) and `.M` (opt-in rewards) balances

        * `.F`: balances earning automatically in Kraken Rewards

        * `.T`: tokenized assets.


        **API Key Permissions Required:** `Funds permissions - Query`'
      tags:
      - Account Data
      operationId: getExtendedBalance
      parameters:
      - $ref: '#/components/parameters/account_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nonce:
                  $ref: '#/components/schemas/nonce'
                rebase_multiplier:
                  $ref: '#/components/schemas/rebase_multiplier'
              required:
              - nonce
      responses:
        '200':
          description: Extended account balances retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/balanceex-2'
                example:
                  error: []
                  result:
                    ZUSD:
                      balance: 25435.21
                      hold_trade: 8249.76
                    XXBT:
                      balance: 1.2435
                      hold_trade: 0.8423
      security:
      - API-Key: []
        API-Sign: []
    servers:
    - url: https://api.kraken.com/0
      description: Production Server
  /private/CreditLines:
    post:
      summary: Get Credit Lines
      description: 'Retrieve all credit line details for VIPs with this functionality.


        **API Key Permissions Required:** `Funds permissions - Query`'
      tags:
      - Account Data
      operationId: getCreditLines
      parameters:
      - $ref: '#/components/parameters/account_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nonce:
                  $ref: '#/components/schemas/nonce'
                rebase_multiplier:
                  $ref: '#/components/schemas/rebase_multiplier'
              required:
              - nonce
      responses:
        '200':
          description: Credit line details retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/creditlines-2'
                example:
                  error: []
                  result:
                    asset_details:
                      USD:
                        balance: '1000.5000'
                        hold_trade: '0.0000'
                        credit: '50000.0000'
                        credit_used: '12500.0000'
                      EUR:
                        balance: '500.2500'
                        hold_trade: '100.0000'
                        credit: '25000.0000'
                        credit_used: '5000.0000'
                    limits_monitor:
                      total_credit_usd: '100000.0000'
                      total_credit_used_usd: '25000.0000'
                      total_collateral_value_usd: '150000.0000'
                      equity_usd: '125000.0000'
                      ongoing_balance: '1.5000'
                      debt_to_equity: '0.2000'
      security:
      - API-Key: []
        API-Sign: []
    servers:
    - url: https://api.kraken.com/0
      description: Production Server
  /private/TradeBalance:
    post:
      summary: Get Trade Balance
      description: 'Retrieve a summary of collateral balances, margin position valuations, equity and margin level.


        **API Key Permissions Required:** `Orders and trades - Query open orders & trades`'
      tags:
      - Account Data
      operationId: getTradeBalance
      parameters:
      - $ref: '#/components/parameters/account_id'
      requestBody:
        $ref: '#/components/requestBodies/balance'
      responses:
        '200':
          description: Trade balances retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/balance-4'
                example:
                  error: []
                  result:
                    eb: '1101.3425'
                    tb: '392.2264'
                    m: '7.0354'
                    n: '-10.0232'
                    c: '21.1063'
                    v: '31.1297'
                    e: '382.2032'
                    mf: '375.1678'
                    ml: '5432.57'
      security:
      - API-Key: []
        API-Sign: []
    servers:
    - url: https://api.kraken.com/0
      description: Production Server
  /private/OpenOrders:
