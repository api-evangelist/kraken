  /private/RemoveExport:
    post:
      summary: Delete Export Report
      description: 'Delete exported trades/ledgers report


        **API Key Permissions Required:** `Data - Export data`'
      tags:
      - Account Data
      operationId: removeExport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
              - nonce
              - id
              - type
              properties:
                nonce:
                  $ref: '#/components/schemas/nonce'
                id:
                  type: string
                  description: ID of report to delete or cancel
                type:
                  type: string
                  description: '`delete` can only be used for reports that have already been processed. Use `cancel` for queued or processing reports.

                    '
                  enum:
                  - cancel
                  - delete
              example:
                nonce: 1695828490
                id: '1234556'
                type: cancel
      responses:
        '200':
          description: Export report deleted or cancelled
          content:
            application/json:
              schema:
                properties:
                  result:
                    type: object
                    properties:
                      delete:
                        type: boolean
                        description: Whether deletion was successful
                      cancel:
                        type: boolean
                        description: Whether cancellation was successful
                  error:
                    $ref: '#/components/schemas/error'
                example:
                  error: []
