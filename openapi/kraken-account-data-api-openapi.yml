  /private/OrderAmends:
    post:
      summary: Get Order Amends
      description: 'Retrieves an audit trail of amend transactions on the specified order. The list is ordered by ascending amend timestamp.


        **API Key Permissions Required:** `Orders and trades - Query open orders & trades` or `Orders and trades - Query closed orders & trades`, depending on status of order.'
      tags:
      - Account Data
      operationId: getOrderAmends
      parameters:
      - $ref: '#/components/parameters/account_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/amends'
      responses:
        '200':
          description: The first entry contains the original order parameters and has amend_type of `original`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/amends-2'
                example:
                  response:
                    error: []
                    result:
                      amends:
                      - amend_id: TSUN4B-EX2XN-WQ6GKG
                        amend_type: original
                        order_qty: '0.01000000'
                        remaining_qty: '0.01000000'
                        limit_price: '61032.8'
                        timestamp: 1724158070287558000
                      - amend_id: TF6VAW-VUWMX-6SXTCH
                        amend_type: user
                        order_qty: '0.01000000'
                        remaining_qty: '0.01000000'
                        limit_price: '61032.7'
                        timestamp: 1724158076936755700
                      - amend_id: TUMY4K-E4MPE-CSL2N3
                        amend_type: user
                        order_qty: '0.01000000'
                        remaining_qty: '0.01000000'
                        limit_price: '61032.6'
                        timestamp: 1724158214879660000
                      count: 3
